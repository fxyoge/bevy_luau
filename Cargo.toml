[package]
name = "bevy_luau"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Portable Luau expressions with native fast paths for Bevy authoring"
license = "MIT OR Apache-2.0"

[features]
serde = ["dep:serde"]

[dependencies]
full_moon = { version = "2.2.0", features = ["luau"] }
mlua = { version = "0.11", features = ["luau", "vendored"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "expressions"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
